test:
  adapter: mysql2
  host: <%= ENV.fetch('MYSQL_HOST', '127.0.0.1').inspect %>
  port: <%= ENV.fetch('MYSQL_PORT', '3306') %>
  username: <%= ENV.fetch('MYSQL_USER', 'root').inspect %>
  password: <%= ENV.fetch('MYSQL_PASSWORD', '').inspect %>
  database: <%= ENV.fetch('MYSQL_PRIMARY_DATABASE', 'active_record_replica_test_primary').inspect %>
  pool: 5
  reader:
    adapter: mysql2
    host: <%= ENV.fetch('MYSQL_HOST', '127.0.0.1').inspect %>
    port: <%= ENV.fetch('MYSQL_PORT', '3306') %>
    username: <%= ENV.fetch('MYSQL_USER', 'root').inspect %>
    password: <%= ENV.fetch('MYSQL_PASSWORD', '').inspect %>
    database: <%= ENV.fetch('MYSQL_REPLICA_DATABASE', 'active_record_replica_test_reader').inspect %>
    pool: 5
